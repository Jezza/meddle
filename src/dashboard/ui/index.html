<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meddle</title>
<style>
  :root {
    --bg: #ffffff; --side: #f6f6f8; --raised: #ffffff; --hover: #ececf0; --sel: #e4e5eb; --line: #e2e2e7; --line-strong: #cfd0d6;
    --fg: #1d1d1f; --fg-soft: #3c3d42; --muted: #75767d; --faint: #a3a4ab;
    --accent: #2f5fd0; --accent-soft: #2f5fd022; --on-accent: #fff;
    --warn: #9a6400; --warn-bg: #fff6e3; --warn-line: #e9cf96; --bad: #b3261e; --bad-bg: #fdecea;
    --code-bg: #f4f5f7; --inline-code: #eef0f3;
    --ok: #2e8b57; --ok-soft: #2e8b5722; --add: #22774a; --add-bg: #2e8b571c; --del-bg: #b3261e14;
    --composer: #ffffff;
    --you-bg: #f1f2f5; --you-line: #d9dbe1; --you-fg: #1d1d1f;
    --chip: #eceef2; --chip-fg: #5c606a;
    --tint-blue: #3d6bc4; --tint-blue-bg: #3574f01a; --tint-amber: #94650f; --tint-amber-bg: #c98a0a1f;
    --tint-green: #3b7d4a; --tint-green-bg: #3d8f4e1c; --tint-purple: #7148b8; --tint-purple-bg: #7c4dd61a;
    --tint-red: #b3261e; --tint-red-bg: #c4302b1a;
    --hl-keyword: #8b3fc6; --hl-string: #2f7d32; --hl-comment: #8c8f96; --hl-title: #2f5fd0; --hl-number: #b45309; --hl-type: #0e7490; --hl-meta: #8c8f96; --hl-attr: #b45309;
    --shadow: 0 8px 28px #0002;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18191d; --side: #1d1f23; --raised: #23262b; --hover: #272a30; --sel: #2c2f36; --line: #2a2d33; --line-strong: #393d45;
      --fg: #d7d9de; --fg-soft: #b9bdc6; --muted: #7f848e; --faint: #5a5f68;
      --accent: #7d9fe6; --accent-soft: #7d9fe633; --on-accent: #0f1a33;
      --warn: #d4b16c; --warn-bg: #2a251b; --warn-line: #5a4a2a; --bad: #e07a7a; --bad-bg: #3a2222;
      --code-bg: #121316; --inline-code: #24272d;
      --ok: #7fb98a; --ok-soft: #7fb98a2e; --add: #7fb98a; --add-bg: #5fb8651a; --del-bg: #db5c5c1c;
      --composer: #202328;
      --you-bg: #272a31; --you-line: #3d424b; --you-fg: #eceef1;
      --chip: #2a2d34; --chip-fg: #b3b8c1;
      --tint-blue: #84a5e0; --tint-blue-bg: #548af724; --tint-amber: #d4b16c; --tint-amber-bg: #d6ae5824;
      --tint-green: #7fb98a; --tint-green-bg: #5fb86522; --tint-purple: #b096dc; --tint-purple-bg: #a571e624;
      --tint-red: #e07a7a; --tint-red-bg: #db5c5c2a;
      --hl-keyword: #c792ea; --hl-string: #c3e88d; --hl-comment: #5c6370; --hl-title: #82aaff; --hl-number: #f78c6c; --hl-type: #ffcb6b; --hl-meta: #89ddff; --hl-attr: #f78c6c;
      --shadow: 0 8px 28px #0008;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 13.5px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); overflow: hidden; }
  #app { height: 100%; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, pre, kbd { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button, a.button { background: var(--raised); border: 1px solid var(--line-strong); border-radius: 5px; padding: 3px 10px; cursor: pointer; color: var(--fg); font-size: 12.5px; }
  button:hover:not(:disabled), a.button:hover { background: var(--hover); text-decoration: none; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }
  .ico { display: inline-flex; flex: none; }
  .ico svg { width: 1em; height: 1em; display: block; }
  button.icon, a.icon { background: none; border: none; padding: 2px 6px; color: var(--muted); font-size: 14px; line-height: 1; border-radius: 4px; }
  button.icon:hover, a.icon:hover, a.icon.on { color: var(--fg); background: var(--hover); text-decoration: none; }
  input, select, textarea { background: var(--bg); border: 1px solid var(--line-strong); border-radius: 5px; padding: 4px 8px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 18px; margin: 0 0 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  h3 { font-size: 13px; font-weight: 600; margin: 20px 0 8px; color: var(--fg-soft); }
  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 8px 0; }
  .muted { color: var(--muted); }
  .error { color: var(--bad); }
  .flag { color: var(--warn); }
  .id { font: 11.5px ui-monospace, monospace; }
  .option { display: block; margin: 3px 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  tr.removed { opacity: 0.5; }

  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: none; margin: 0 7px 1px 1px; vertical-align: middle; background: var(--faint); }
  .dot.run { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .dot.wait { background: var(--warn); }
  .dot.move { background: var(--warn); opacity: 0.6; }
  .dot.idle { border: 1px solid var(--muted); }
  .dot.ok { background: var(--ok); }
  .dot.busy { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .dot.off { background: var(--faint); }
  .dot.bad { background: var(--bad); }

  .boot { padding: 24px; }
  .app { display: grid; grid-template-columns: 290px minmax(0, 1fr); height: 100%; }
  .app.nav-closed { grid-template-columns: minmax(0, 1fr); }

  /* ─── sidebar ─── */
  .sidebar { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; user-select: none; }
  .side-top { display: flex; align-items: center; gap: 4px; padding: 8px 10px 6px 14px; flex: none; }
  .side-top .brand { margin-right: auto; font-size: 13px; letter-spacing: 0.02em; }
  .side-scroll { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  .side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 10px 10px 4px 14px; color: var(--muted); font-size: 12px; }
  button.side-head { background: none; border: none; border-radius: 0; text-align: left; cursor: pointer; }
  button.side-head:hover { color: var(--fg); background: none; }
  .side-head .count { font-size: 11px; }
  .side-note { padding: 2px 14px; color: var(--muted); font-size: 12px; }
  .side-project { display: flex; align-items: center; gap: 8px; padding: 4px 14px; color: var(--fg); font-weight: 500; }
  .side-project:hover { background: var(--hover); text-decoration: none; }
  .folder { color: var(--muted); font-size: 10px; }
  .side-row { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 14px; color: var(--fg); white-space: nowrap; min-height: 27px; }
  .side-row.indent { padding-left: 32px; }
  .side-row:hover { background: var(--hover); text-decoration: none; }
  .side-row.sel, .side-project.sel, .node-row.sel { background: var(--sel); }
  .side-row.new { color: var(--faint); font-size: 12px; min-height: 24px; }
  .side-row.new::before { content: "+"; width: 7px; text-align: center; flex: none; }
  .side-row.new:hover { color: var(--fg-soft); background: none; }
  .side-row.archived { color: var(--muted); }
  .side-row .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .side-row .where { color: var(--muted); font-size: 11px; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
  .side-row .where.moving { color: var(--warn); }
  .side-row .more { display: none; background: none; border: none; padding: 0 4px; color: var(--muted); }
  .side-row:hover .more { display: inline; }
  .side-row:hover .where { display: none; }
  .side-row .rename { flex: 1; min-width: 0; padding: 1px 6px; }
  /* A project's 🚂 Train, and the 🚂 on a queued task's row: both open the project's train page. */
  .side-row.train-entry { color: var(--fg-soft); font-size: 12px; min-height: 24px; }
  .train-entry .count { background: var(--chip); color: var(--chip-fg); border-radius: 9px; font-size: 10.5px; padding: 0 6px; flex: none; }
  .side-row .queued-mark { background: none; border: none; padding: 0 2px; font-size: 11px; line-height: 1; flex: none; }
  .side-row .queued-mark:hover:not(:disabled) { background: none; filter: brightness(1.2); }
  .badge { background: var(--warn); color: var(--bg); font-size: 10px; font-weight: 700; border-radius: 8px; padding: 0 5px; flex: none; }
  /* How many of a task's agents run. */
  .agent-count { display: inline-flex; align-items: center; gap: 3px; flex: none; font-size: 11px; font-weight: 600; color: var(--tint-purple);
    background: var(--tint-purple-bg); border-radius: 8px; padding: 0 6px 0 4px; }
  .agent-count svg { width: 11px; height: 11px; }
  .side-foot { border-top: 1px solid var(--line); padding: 2px 0 8px; flex: none; max-height: 40%; overflow-y: auto; }
  .side-foot .side-head { padding-top: 8px; }
  .node-row { display: flex; align-items: center; gap: 8px; padding: 3px 10px 3px 14px; color: var(--fg); font-size: 12.5px; }
  .node-row:hover { background: var(--hover); text-decoration: none; }
  .node-row .meta { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }

  /* ─── panes ─── */
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; position: relative; }
  .pane .notice { margin: 0; padding: 6px 16px; background: var(--bad-bg); }
  .pane-head { display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-bottom: 1px solid var(--line); min-height: 41px; flex: none; }
  .pane-head strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane-note { padding: 16px 18px; margin: 0; }
  .page { flex: 1; overflow-y: auto; padding: 8px 20px 40px; max-width: 980px; }
  .page section { margin: 0; }
  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li { padding: 3px 0; display: flex; align-items: center; gap: 6px; }
  .form { display: flex; flex-direction: column; gap: 12px; max-width: 520px; margin-top: 12px; }
  .form label { display: flex; flex-direction: column; gap: 4px; color: var(--fg-soft); }

  /* ─── a project: its graph, memory and tasks side by side, each scrolling on its own; one at a time when narrow ─── */
  .project { display: flex; flex-direction: column; height: 100%; min-height: 0; container-type: inline-size; }
  .proj-home { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav.proj-tabs { display: none; }
  .proj-cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 0.8fr); }
  .proj-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
  .proj-col:last-child { border-right: none; }
  .col-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 38px; padding: 5px 16px; border-bottom: 1px solid var(--line); flex: none; }
  .col-head h3 { margin: 0; }
  .col-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 16px 40px; }
  .col-body > :first-child { margin-top: 0; }
  .proj-branches { margin-bottom: 10px; }
  /* A conflicted branch's help under its name, its long commands broken anywhere, in a column only a few hundred px wide. */
  .proj-branches li { flex-wrap: wrap; }
  .proj-branches li > div { flex-basis: 100%; overflow-wrap: anywhere; }
  @container (max-width: 1100px) {
    nav.proj-tabs { display: flex; }
    .proj-cols { grid-template-columns: minmax(0, 1fr); }
    .proj-col { border-right: none; }
    .proj-col:not(.on) { display: none; }
  }

  /* ─── a project's train: Queued, and This round with its merge task and the batch under it ─── */
  .train { display: flex; flex-direction: column; height: 100%; min-height: 0; container-type: inline-size; }
  .train-wait { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .train-error { font-size: 12px; margin: 6px 14px; }
  .pane-head .train-error { margin: 0; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .train-board { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); }
  .train-col { min-width: 0; min-height: 0; overflow-y: auto; border-right: 1px solid var(--line); padding-bottom: 24px; }
  .train-col:last-child { border-right: none; }
  .train-col.round { background: color-mix(in srgb, var(--tint-purple-bg) 45%, transparent); }
  .train-colhead { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 9px 12px 5px; }
  .train-empty { margin: 0; padding: 6px 12px; color: var(--faint); font-size: 12px; }
  .train-steps { display: flex; flex-wrap: wrap; gap: 4px; font-size: 10.5px; padding: 0 12px 6px; }
  .train-steps span { padding: 0 6px; border-radius: 9px; background: var(--chip); color: var(--muted); }
  .train-steps span.finished { color: var(--ok); }
  .train-steps span.current { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .train-row { display: flex; align-items: center; gap: 7px; padding: 6px 12px; font-size: 12px; border-top: 1px solid var(--line); }
  .train-row.hl { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .train-row .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .train-row a.tt { color: var(--fg); }
  .train-row .tree { color: var(--faint); font-family: ui-monospace, monospace; width: 14px; flex: none; }
  .train-row button.link { background: none; border: none; color: var(--muted); padding: 0 2px; font-size: 11.5px; }
  .train-row button.link:hover:not(:disabled) { background: none; color: var(--fg); text-decoration: underline; }
  .train-chip { display: inline-block; flex: none; background: var(--chip); color: var(--chip-fg); border-radius: 4px; padding: 0 5px; font-size: 10.5px; white-space: nowrap; }
  .train-chip.blue { background: var(--tint-blue-bg); color: var(--tint-blue); }
  .train-chip.warn { background: var(--warn-bg); color: var(--warn); }
  .train-chip.purple { background: var(--tint-purple-bg); color: var(--tint-purple); }
  .train-merge { margin: 4px 12px 6px; border: 1px solid var(--tint-purple); border-radius: 7px; background: var(--tint-purple-bg); padding: 8px 10px; }
  .train-merge .mt { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .train-merge .mt .grow { flex: 1; }
  .train-merge .mt a { font-weight: 400; font-size: 12px; }
  .train-merge .ms { font-size: 11.5px; color: var(--fg-soft); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .train-merge + .train-row { border-top: none; }
  @container (max-width: 640px) {
    .train-board { grid-template-columns: minmax(0, 1fr); overflow-y: auto; }
    .train-col { overflow-y: visible; border-right: none; border-bottom: 1px solid var(--line); }
  }

  /* ─── a project's memory ─── */
  .sec { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 20px 0 8px; }
  .sec h3 { margin: 0; }
  button.sec-toggle { background: none; border: none; padding: 0; font: inherit; color: inherit; }
  button.sec-toggle:hover:not(:disabled) { background: none; }
  .caret { display: inline-block; width: 10px; flex: none; color: var(--faint); font-size: 10px; }
  button.quiet { background: none; border-color: transparent; color: var(--muted); }
  button.quiet:hover:not(:disabled) { color: var(--fg); }
  button.danger, button.danger:hover:not(:disabled) { color: var(--bad); }
  .tag { font-size: 10.5px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; white-space: nowrap; flex: none; }
  .mem-list { border-top: 1px solid var(--line); }
  .mem-entry { border-bottom: 1px solid var(--line); }
  .mem-row { display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 6px 8px; background: none; border: none; border-radius: 0; text-align: left; font-size: 13.5px; cursor: pointer; }
  .mem-row:hover:not(:disabled) { background: var(--hover); }
  .mem-row.hist { flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; }
  button.hist-toggle { display: inline-flex; align-items: baseline; gap: 10px; background: none; border: none; border-radius: 0; padding: 0; font-size: inherit; }
  button.hist-toggle:hover:not(:disabled) { background: none; }
  .mem-row .add { color: var(--add); }
  .mem-row .del { color: var(--bad); }
  .mem-name { font-weight: 500; white-space: nowrap; }
  .mem-hook { flex: 1; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mem-body { padding: 2px 8px 12px 28px; }
  .mem-body .md { margin-bottom: 10px; }
  .mem-body .diff { margin: 6px 0 10px; }
  .mem-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  /* An opened entry: its text and its actions in one card, the actions in a strip along the bottom. */
  .mem-card { background: var(--raised); border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
  .mem-text-view { padding: 12px 14px; }
  .mem-card .md { margin: 0; }
  .mem-card .mem-foot { padding: 5px 8px 5px 14px; border-top: 1px solid var(--line-strong); background: var(--side); }
  .mem-file { display: block; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
  input.mem-file { color: var(--fg); font: 12.5px ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace; }
  .mem-text { display: block; width: 100%; min-height: 176px; margin-bottom: 8px; padding: 8px 10px; resize: vertical; font: 12.5px/1.55 ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace; }
  .mem-older { padding: 6px 0; }
  .scrim { position: fixed; inset: 0; background: #0006; z-index: 20; }
  .app.narrow { grid-template-columns: minmax(0, 1fr); }
  .app.narrow .sidebar { position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); z-index: 30; box-shadow: var(--shadow); }

  /* ─── a task ─── */
  .task { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .task-title { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .task-title .rename { flex: 1; max-width: 640px; }
  .state-text { font-size: 12px; white-space: nowrap; }
  .head-actions { display: flex; align-items: center; gap: 4px; flex: none; }
  .head-actions button { background: none; border-color: transparent; color: var(--muted); padding: 2px 7px; }
  .head-actions button:hover:not(:disabled) { color: var(--fg); background: var(--hover); }
  .head-actions button.on { border-color: var(--line-strong); color: var(--fg); }
  .head-actions button.accept, .head-actions button.accept:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .head-actions button.accept:hover:not(:disabled) { filter: brightness(1.1); }
  .head-actions .error { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  /* The Thread / Changes switch. */
  .task-tabs { display: flex; gap: 2px; background: var(--side); border: 1px solid var(--line); border-radius: 6px; padding: 2px; margin-right: 4px; }
  .task-tabs a { padding: 1px 10px; border-radius: 4px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .task-tabs a:hover { color: var(--fg); text-decoration: none; }
  .task-tabs a.on { background: var(--sel); color: var(--fg); }
  /* A task's changes: the graph of them on the left, the selection's diffs on the right. */
  .changes { flex: 1; min-height: 0; display: flex; overflow: hidden; }
  .chg-list { flex: 1 1 220px; max-width: 270px; padding: 10px 8px; border-right: 1px solid var(--line); overflow-y: auto; }
  .chg-project { margin: 0 0 8px 6px; }
  .chg { display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: center; width: 100%; min-height: 44px; padding: 0 6px 0 0; background: none; border: none; border-radius: 5px; text-align: left; color: var(--fg); font-size: 12.5px; }
  button.chg:hover:not(:disabled) { background: var(--hover); }
  button.chg.sel, button.chg.sel:hover:not(:disabled) { background: var(--sel); }
  .chg.quiet, .chg.start { color: var(--muted); }
  .chg-text { min-width: 0; padding: 5px 0; }
  .chg-label { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
  .chg .meta { display: block; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chg .add, .chg-sum .add { color: var(--add); }
  .chg .del, .chg-sum .del { color: var(--bad); }
  .chg-space { height: 6px; }
  .chg-start { background: var(--hover); color: var(--fg); border-radius: 4px; padding: 0 6px; font-size: 11.5px; }
  .chg-rail { position: relative; align-self: stretch; }
  .chg-graph { position: absolute; inset: 0; width: 28px; height: 100%; display: block; overflow: visible; }
  .chg-graph line { stroke: var(--faint); stroke-width: 1.5; }
  .chg-graph .pt { fill: var(--bg); stroke: var(--fg-soft); stroke-width: 1.5; }
  .chg-graph .pt.wc { fill: var(--accent); stroke: none; }
  .chg-graph .pt.empty { stroke: var(--faint); stroke-dasharray: 2 2; }
  .chg-graph .pt.bad { stroke: var(--warn); }
  .chg-graph .diamond { fill: var(--fg-soft); }
  /* No padding above, so that a file's head held at the top of the view meets its edge. */
  .chg-main { flex: 999 1 480px; min-width: 0; overflow-y: auto; padding: 0 20px 40px; }
  .chg-sum { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin: 0 0 12px; padding-top: 14px; font-size: 12.5px; color: var(--fg-soft); }
  .chg-sum .add, .chg-sum .del { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace; }
  .chg-file { margin: 0 0 12px; }
  .chg-file .diff-body { max-height: none; }
  /* A file's head stays at the top of the view while its rows scroll by, so it can be hidden from anywhere in it. */
  .chg-file .diff-head { position: sticky; top: 0; z-index: 1; }
  .diff-head .chev, .tree-row .chev { flex: none; width: 12px; height: 12px; color: var(--faint); transition: transform 0.12s; }
  .diff-head [aria-expanded="true"] .chev, .tree-row[aria-expanded="true"] .chev { transform: rotate(90deg); }
  /* The selection's files as a tree, between the changes and their diffs. */
  .chg-tree { flex: 1 1 200px; min-width: 150px; max-width: 250px; padding: 10px 6px; border-right: 1px solid var(--line); overflow-y: auto; }
  .tree-row { display: flex; align-items: center; gap: 4px; width: 100%; min-height: 26px; padding: 2px 6px; background: none; border: none; border-radius: 5px; text-align: left; color: var(--fg); font-size: 12.5px; }
  button.tree-row:hover:not(:disabled) { background: var(--hover); }
  .tree-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-row.added .tree-name { color: var(--add); }
  .tree-row.deleted .tree-name { color: var(--bad); text-decoration: line-through; }
  .chg-file .error { margin: 4px 0 0; font-size: 12px; }
  .chg-main > .error { margin: 0 0 12px; }

  /* ─── a project's graph ─── */
  .graph { border: 1px solid var(--line); border-radius: 8px; padding: 6px 4px; }
  .graph .g { display: grid; min-height: 30px; }
  .graph .g-rail { position: relative; }
  .graph .g-rail svg { position: absolute; top: 0; left: 0; height: 100%; display: block; overflow: visible; }
  .graph path, .graph line { fill: none; stroke: var(--faint); stroke-width: 1.5; }
  .graph .stub { stroke-dasharray: 2 3; }
  .graph .pt { fill: var(--bg); stroke: var(--fg-soft); stroke-width: 1.5; }
  .graph .pt.head { fill: var(--accent); stroke: none; }
  .graph .pt.alone { stroke: var(--warn); }
  .graph .diamond { fill: var(--fg-soft); }
  .graph .tilde { fill: var(--faint); font: 12px ui-monospace, monospace; }
  .graph .g-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; min-width: 0; padding: 5px 4px 5px 0; font-size: 12.5px; line-height: 20px; }
  .graph .g-row:hover { background: var(--side); }
  .graph .bm { font-size: 11.5px; line-height: 18px; border-radius: 4px; padding: 0 6px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .graph .bm.line { background: var(--tint-blue-bg); color: var(--tint-blue); }
  .graph .bm.branch { background: var(--hover); color: var(--fg); }
  .graph .bm.branch.flag { color: var(--warn); }
  .graph .bm.behind { background: none; border: 1px dashed var(--line-strong); color: var(--muted); }
  .graph .at { min-width: 0; font-size: 11px; color: var(--muted); }
  .graph .at-node { white-space: nowrap; }
  .graph .cid { font: 11.5px ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace; color: var(--muted); }
  .graph .desc { flex: 1 1 12em; min-width: 0; color: var(--fg-soft); overflow-wrap: anywhere; }
  .graph button.older { background: none; border: none; padding: 0; color: var(--accent); font-size: 12px; }
  .graph button.older:hover:not(:disabled) { background: none; text-decoration: underline; }
  /* What waits on you, beneath the changes. */
  .pending-strip { flex: none; max-height: 45vh; overflow-y: auto; padding: 10px 22px 0; border-top: 1px solid var(--line); }
  .pending-strip .ask { max-width: 860px; margin: 0 auto 10px; }
  .banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 7px 16px; background: var(--warn-bg); color: var(--warn); border-bottom: 1px solid var(--warn-line); flex: none; }
  .banner-actions { margin-left: auto; display: flex; gap: 6px; }
  /* Positioned, so that what is placed absolutely inside it (`.sr`) scrolls and clips with it rather than making the page scroll. */
  .thread-scroll { flex: 1; overflow-y: auto; min-height: 0; position: relative; }
  .thread { max-width: 860px; margin: 0 auto; padding: 18px 22px 12px; }
  .thread .earlier { margin: 0 0 14px; }
  .msg { margin: 0 0 20px; }
  /* Your messages sit in a card; Claude's prose reads at full size. */
  .msg.you { background: var(--you-bg); border: 1px solid var(--you-line); color: var(--you-fg); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .msg.claude .md { font-size: 14px; line-height: 1.6; }
  /* The merge train's prompts: a card like yours, dashed, under meddle's name. */
  .msg.you.meddle { border-style: dashed; }
  .msg.you .by { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .msg.queued { opacity: 0.6; }
  .msg.queued .tag { display: inline-block; margin-top: 4px; }
  .msg.failed { border-color: color-mix(in srgb, var(--bad) 55%, var(--you-line)); }
  .failed-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; }
  .failed-line .ico { font-size: 14px; }
  .failed-acts { margin-left: auto; display: flex; gap: 2px; }
  .failed-acts button { background: none; border: none; padding: 1px 6px; color: var(--fg-soft); font-size: 12px; }
  .user-text { white-space: pre-wrap; overflow-wrap: anywhere; }
  /* A prompt's files above its text: images as thumbnails, any other file as a chip with its name and size. */
  .attachments { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; }
  .msg.you .attachments + * { margin-top: 8px; }
  .thumb { display: block; line-height: 0; }
  .thumb img { max-width: 240px; max-height: 160px; border: 1px solid var(--you-line); border-radius: 6px; background: var(--bg); }
  .att { display: inline-flex; align-items: center; gap: 6px; height: 34px; max-width: 280px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--raised); color: var(--fg); font-size: 12px; }
  a.att:hover { background: var(--hover); text-decoration: none; }
  .att .ico { color: var(--muted); font-size: 14px; }
  .att-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att-size { flex: none; color: var(--muted); }
  .status-block { margin: -8px 0 16px; }
  .turn-end { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; margin: 6px 0; }
  .turn-end i { flex: 1; height: 1px; background: var(--line-strong); }
  .turn-end.bad { color: var(--bad); }
  .status { color: var(--faint); font-size: 11.5px; }
  .status.bad { color: var(--bad); }
  .md { overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md h1, .md h2, .md h3, .md h4 { margin: 18px 0 8px; font-size: 15px; font-weight: 600; color: var(--fg); }
  .md h1 { font-size: 17px; }
  .md code { background: var(--inline-code); padding: 1px 4px; border-radius: 3px; font-size: 12.5px; }
  .md pre.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 8px 0 12px; }
  .md pre.code code { background: none; padding: 0; font-size: 12.5px; line-height: 1.5; }
  .md blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--line-strong); color: var(--fg-soft); }
  .md table { margin: 0 0 12px; width: auto; }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
  .hljs-keyword, .hljs-selector-tag, .hljs-built_in.hljs-keyword { color: var(--hl-keyword); }
  .hljs-string, .hljs-regexp, .hljs-addition { color: var(--hl-string); }
  .hljs-comment, .hljs-quote { color: var(--hl-comment); font-style: italic; }
  .hljs-title, .hljs-title.function_, .hljs-section { color: var(--hl-title); }
  .hljs-number, .hljs-literal, .hljs-symbol, .hljs-bullet { color: var(--hl-number); }
  .hljs-type, .hljs-title.class_, .hljs-built_in { color: var(--hl-type); }
  .hljs-meta, .hljs-variable.language_ { color: var(--hl-meta); }
  .hljs-attr, .hljs-attribute, .hljs-params { color: var(--hl-attr); }
  .hljs-deletion { color: var(--bad); }
  .thinking-text { white-space: pre-wrap; color: var(--muted); padding: 2px 0 2px 12px; border-left: 2px solid var(--line); }
  .live .md { opacity: 0.9; }
  /* --stall (0 to 1, set by the page) blends the line from muted to red as a turn that should be streaming stays quiet. */
  .working { --stall: 0; display: flex; gap: 6px; align-items: center; height: 1.5em; font-size: 12.5px; white-space: nowrap; overflow: hidden;
    color: color-mix(in srgb, var(--bad) calc(var(--stall) * 100%), var(--muted)); transition: color 1s linear; }
  .working .elapsed { color: var(--faint); font-variant-numeric: tabular-nums; }
  .working .quiet { font-variant-numeric: tabular-nums; }
  .dots { display: inline-flex; gap: 4px; align-items: center; margin-right: 2px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: working 1.2s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: 0.15s; }
  .dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes working { 0%, 60%, 100% { opacity: 0.25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation-duration: 2.4s; transform: none !important; } }
  /* One row per call (or per run of calls that only look): chevron, icon, name, target, and what came of it. */
  .step { margin: 1px 0; font-size: 12.5px; }
  /* Rows sit tight together, with room between them and the prose either side. */
  .msg > .step + :not(.step) { margin-top: 12px; }
  .msg > :not(.step) + .step { margin-top: 8px; }
  .step > summary { list-style: none; display: flex; align-items: center; gap: 9px; padding: 4px 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; min-height: 34px; color: var(--fg-soft); }
  .step > summary::-webkit-details-marker { display: none; }
  .step > summary:hover { background: var(--hover); }
  .step .chev { flex: none; width: 12px; height: 12px; color: var(--faint); transition: transform 0.12s; }
  .step[open] > summary .chev { transform: rotate(90deg); }
  /* Each call's icon sits in a small square, tinted faintly by kind: looks blue, changes amber, commands green,
     subagents purple; red once it fails, blue while it runs. */
  .chip { flex: none; width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: var(--chip); color: var(--chip-fg); }
  .chip .ic { width: 13px; height: 13px; }
  .chip.search, .chip.running { background: var(--tint-blue-bg); color: var(--tint-blue); }
  .chip.edit, .chip.write { background: var(--tint-amber-bg); color: var(--tint-amber); }
  .chip.bash { background: var(--tint-green-bg); color: var(--tint-green); }
  .chip.agent, .chip.done { background: var(--tint-purple-bg); color: var(--tint-purple); }
  .chip.failed { background: var(--tint-red-bg); color: var(--tint-red); }
  .sub .chip { width: 20px; height: 20px; border-radius: 5px; }
  .sub .chip .ic { width: 12px; height: 12px; }
  .step .verb { flex: none; min-width: 58px; color: var(--muted); }
  .sub .step .verb { min-width: 50px; }
  .step .target { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12.5px ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace; color: var(--fg); }
  .step .target.plain { font: inherit; color: var(--fg-soft); }
  .step .target.muted { color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .step .meta { flex: none; font: 12px ui-monospace, monospace; color: var(--muted); font-variant-numeric: tabular-nums; }
  .step .meta .add { color: var(--add); }
  .step .meta .del { color: var(--bad); }
  .step.bad > summary .meta { color: var(--bad); }
  /* A running agent's row says, under its name, what the agent is doing now. */
  .step.agent > summary { flex-wrap: wrap; row-gap: 0; }
  .now { flex-basis: 100%; display: flex; align-items: center; gap: 6px; padding: 0 0 2px 51px; margin-top: -4px;
    color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; }
  .now .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 12px ui-monospace, "JetBrains Mono", Menlo, monospace; color: var(--fg-soft); }
  .now .dots i { width: 4px; height: 4px; }
  .step.focus > summary { background: var(--accent-soft); }
  .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
  .step-body { margin: 2px 0 8px 30px; display: flex; flex-direction: column; gap: 6px; }
  .step-body:empty { display: none; }
  .step .out { margin: 0; padding: 7px 10px; background: var(--code-bg); border: 1px solid var(--line-strong); border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-size: 12px; max-height: 320px; overflow: auto; color: var(--fg-soft); }
  .step .out.error { background: var(--bad-bg); }
  .diff { border: 1px solid var(--line-strong); border-radius: 8px; background: var(--code-bg); font: 12px/1.55 ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace; }
  .diff-body { max-height: 420px; overflow: auto; overflow-anchor: none; border-radius: 0 0 7px 7px; }
  .diff-body:first-child { border-radius: 7px; }
  .diff.open .diff-body { max-height: 70vh; }
  .diff-head { display: flex; align-items: center; gap: 10px; padding: 5px 10px; background: var(--side); border-bottom: 1px solid var(--line-strong); border-radius: 7px 7px 0 0; font: 12px system-ui, sans-serif; }
  .diff-head:last-child { border-bottom: none; border-radius: 7px; }
  .diff-head .path { display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow-wrap: anywhere; font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace; }
  .diff-head .tag { font-size: 10.5px; border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; color: var(--muted); }
  .diff-head .add { color: var(--add); }
  .diff-head .del { color: var(--bad); }
  .diff-head button { margin-left: auto; background: none; border: none; padding: 0; color: var(--accent); }
  .diff-head button:hover:not(:disabled) { background: none; text-decoration: underline; }
  .diff-head button.path { margin-left: 0; background: none; border: none; padding: 0; font: inherit; font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace; color: var(--fg); cursor: pointer; }
  .dl { display: flex; white-space: pre; padding-right: 10px; min-width: max-content; }
  .dl .n { flex: none; width: 40px; padding-right: 8px; text-align: right; color: var(--faint); user-select: none; }
  .dl .s { flex: none; width: 14px; color: var(--muted); user-select: none; }
  .dl.add { background: var(--add-bg); }
  .dl.add .s { color: var(--add); }
  .dl.del { background: var(--del-bg); }
  .dl.del .s { color: var(--bad); }
  .dl.gap { width: 100%; padding: 2px 10px 2px 94px; border: none; border-radius: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: none; color: var(--muted); font: 11.5px system-ui, sans-serif; text-align: left; }
  .dl.gap:first-child { border-top: none; }
  .dl.gap:last-child { border-bottom: none; }
  button.dl.gap { color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); cursor: pointer; }
  button.dl.gap:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .sub { margin: 0 0 4px 6px; padding-left: 14px; border-left: 2px solid var(--line-strong); }
  .sub .md { font-size: 13px; color: var(--fg-soft); margin: 4px 0 6px; }
  .tool-note { margin: 0; font-size: 12px; }
  /* An agent's report, as its row's result. */
  .report { background: var(--raised); border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 14px; }
  .report .md { font-size: 13px; line-height: 1.55; color: var(--fg); margin: 0; }
  .report-head { display: flex; gap: 10px; align-items: baseline; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
  .report-head button { margin-left: auto; background: none; border: none; padding: 0; color: var(--accent); font-size: inherit; }
  .report-head button:hover:not(:disabled) { background: none; text-decoration: underline; }
  .report-head button:first-child { margin-left: 0; }
  .asked { border-left: 3px solid var(--warn); padding-left: 10px; margin: 4px 0 10px; }
  .asked p { margin: 4px 0; }
  .denied { color: var(--bad); margin: 4px 0 10px; font-size: 12.5px; }
  .ask { margin: 0 0 16px; border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: 8px; padding: 10px 14px; }
  .ask h4 { margin: 0 0 8px; color: var(--warn); font-size: 13px; }
  .ask pre { margin: 6px 0; padding: 8px 10px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; white-space: pre-wrap; word-break: break-word; font-size: 12.5px; max-height: 280px; overflow: auto; }
  .ask textarea { width: 100%; font: 12.5px ui-monospace, monospace; }
  .ask details summary { cursor: pointer; font-size: 12px; }
  .ask-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .deny-message { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .deny-message input { flex: 1; }
  .question { margin: 8px 0; }
  .question-head { margin-bottom: 4px; }
  /* The task's agents above the composer, as wide; never more than a third of the pane, its rows scrolling inside. */
  .agents { margin: 0 auto 8px; width: calc(100% - 44px); max-width: 816px; max-height: 33vh; overflow-y: auto; border: 1px solid var(--line-strong);
    border-radius: 8px; background: var(--side); font-size: 12.5px; flex: none; }
  .agents-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 5px 10px; color: var(--fg-soft);
    background: var(--side); border-bottom: 1px solid var(--line); }
  .agents.folded .agents-head { border-bottom: none; }
  .agents-head svg.lead { flex: none; width: 13px; height: 13px; color: var(--tint-purple); }
  .agents-head .sum { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .agents-head .toggle { margin-left: auto; flex: none; background: none; border: none; color: var(--muted); padding: 0 4px; }
  .arow { display: grid; grid-template-columns: 20px minmax(0, 1fr) minmax(0, 1.15fr) max-content; gap: 10px; align-items: center; width: 100%;
    padding: 3px 10px; min-height: 28px; background: none; border: none; border-radius: 0; text-align: left; font-size: inherit; }
  button.arow.sel, button.arow.sel:hover:not(:disabled) { background: var(--sel); box-shadow: inset 2px 0 0 var(--accent); }
  .arow .chip { width: 20px; height: 20px; border-radius: 5px; }
  .arow .chip .ic { width: 12px; height: 12px; }
  .arow .name { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arow .doing { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px ui-monospace, "JetBrains Mono", Menlo, monospace; }
  .arow .nums { color: var(--muted); font: 11.5px ui-monospace, monospace; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .arow.fin .name { color: var(--fg-soft); }
  .arow.fin .doing { font-family: inherit; }
  .arow.stopped .doing { color: var(--bad); }
  .amore { display: block; padding: 2px 10px 6px 40px; background: none; border: none; border-radius: 0; color: var(--accent); font-size: 12px; text-align: left; }
  button.amore:hover:not(:disabled) { background: none; text-decoration: underline; }
  .composer { margin: 0 auto 12px; width: calc(100% - 44px); max-width: 816px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--composer); flex: none; }
  .composer:focus-within { border-color: var(--accent); }
  .composer textarea { display: block; width: 100%; border: none; background: none; resize: none; padding: 10px 12px; min-height: 44px; max-height: 40vh; overflow-y: auto; outline: none; font: inherit; }
  .composer-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 8px 6px 12px; border-top: 1px solid var(--line); font-size: 12px; }
  .composer-field { display: flex; align-items: flex-end; gap: 4px; padding-right: 6px; }
  .composer-field textarea { flex: 1; min-width: 0; }
  button.send { flex: none; width: 30px; height: 30px; margin-bottom: 7px; display: grid; place-items: center; padding: 0; border: none; border-radius: 6px; background: none; color: var(--faint); font-size: 17px; }
  button.send:disabled:not(.ready) { opacity: 1; }
  button.send.ready { background: var(--accent); color: var(--on-accent); }
  button.send.ready:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }
  /* Files over the composer; its files in a row above the text, each going while it uploads, red when it could not. */
  .composer.drop { border-style: dashed; border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft), var(--composer)); }
  .composer .attachments { padding: 8px 10px 0; }
  .att.pic { padding-left: 0; overflow: hidden; }
  .att-thumb { width: 48px; height: 100%; object-fit: cover; flex: none; }
  .att.uploading .att-thumb { opacity: 0.5; }
  .att-spin { width: 13px; height: 13px; flex: none; color: var(--muted); }
  .att.failed { border-color: var(--bad); }
  .att-bad .ico { color: var(--bad); }
  .att .x { flex: none; background: none; border: none; padding: 0 2px; color: var(--muted); font-size: 14px; line-height: 1; }
  .att .x:hover:not(:disabled) { background: none; color: var(--fg); }
  button.attach { flex: none; width: 30px; height: 30px; margin-bottom: 7px; display: grid; place-items: center; padding: 0; border: none; border-radius: 6px; background: none; color: var(--muted); font-size: 17px; }
  .composer-row button.attach { width: 24px; height: 24px; margin: 0; font-size: 15px; }
  .new-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 15px; }
  .new-empty b { color: var(--fg); margin-left: 4px; }
  .bar { display: flex; align-items: center; gap: 6px 14px; padding: 5px 14px; border-top: 1px solid var(--line); background: var(--side); color: var(--muted); font-size: 12px; flex: none; min-width: 0; container-type: inline-size; }
  .bar > * { flex: none; }
  .bar > .bar-item { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar > .bar-gap { flex: 1 1 0; }
  /* The projects never shrink: a name stays whole up to 16ch, and below 760px of bar they collapse to the pill. */
  .bar > .bar-projects { display: flex; align-items: center; gap: 14px; }
  .bar-entry { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .bar-name { color: var(--fg); max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-projects + .bar-collapsed { display: none; }
  .bar > .bar-collapsed { flex: 0 1 auto; min-width: 0; white-space: nowrap; }
  .bar-collapsed .bar-name { min-width: 0; }
  @container (max-width: 760px) {
    .bar > .bar-projects { display: none; }
    .bar-projects + .bar-collapsed { display: inline-flex; }
  }
  .bar-sep { width: 1px; height: 14px; background: var(--line-strong); }
  .usage-meter { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .usage-k { color: var(--faint); }
  .usage-meter .meter { display: inline-block; width: 34px; height: 5px; border-radius: 3px; background: var(--line-strong); overflow: hidden; }
  .usage-meter .meter > i { display: block; height: 100%; background: var(--muted); }
  .usage-meter.level-warn, .usage-meter.level-warn .usage-k { color: var(--warn); }
  .usage-meter.level-warn .meter > i { background: var(--warn); }
  .usage-meter.level-bad, .usage-meter.level-bad .usage-k { color: var(--bad); }
  .usage-meter.level-bad .meter > i { background: var(--bad); }
  .usage-meter.faded { opacity: 0.55; }
  .usage-note { margin-left: 2px; }
  .token-usage { display: flex; flex-direction: column; gap: 2px; white-space: nowrap; }
  .token-usage .usage-meter .meter { width: 46px; }
  .rev { display: inline-flex; align-items: center; gap: 5px; background: none; border: none; border-radius: 4px; padding: 0 4px; color: var(--fg-soft); font: 12px ui-monospace, "JetBrains Mono", Menlo, monospace; white-space: nowrap; }
  .rev:hover { background: var(--hover); }
  .rev .ico { color: var(--muted); }
  span.rev.flag { color: var(--warn); }
  .menu-row { display: flex; align-items: center; gap: 10px; padding: 5px 12px; color: var(--fg); }
  .menu-row .rev { margin-left: auto; }
  .bar-gap { flex: 1; }
  .pill, select.pill { background: var(--hover); border: 1px solid transparent; border-radius: 5px; padding: 1px 8px; color: var(--fg); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
  .pill.add { background: none; border: 1px dashed var(--line-strong); color: var(--muted); }
  select.pill { appearance: none; -webkit-appearance: none; padding-right: 8px; cursor: pointer; field-sizing: content; }
  .pill .x { background: none; border: none; padding: 0 0 0 2px; color: var(--muted); }

  /* ─── menus ─── */
  .popover { position: fixed; z-index: 50; min-width: 180px; max-width: min(380px, calc(100vw - 16px)); background: var(--raised); border: 1px solid var(--line-strong); border-radius: 7px; box-shadow: var(--shadow); padding: 5px 0; font-size: 12.5px; }
  .popover.wide { min-width: 320px; }
  .menu-head { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 12px; }
  .menu-item { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: none; border-radius: 0; padding: 5px 12px; text-align: left; font-size: 12.5px; }
  .menu-item:hover:not(:disabled) { background: var(--hover); }
  .menu-label { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .menu-meta { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; padding-left: 12px; }
  .menu-sep { border-top: 1px solid var(--line); margin: 5px 0; }
  .menu-note { padding: 4px 12px; color: var(--muted); }
  .menu-item.on { background: var(--accent-soft); }
  .menu-check { width: 12px; flex: none; color: var(--accent); }
  .menu-two { display: flex; flex-direction: column; min-width: 0; }
  .menu-desc { color: var(--muted); font-size: 11.5px; white-space: normal; }
  .menu-seg { display: flex; gap: 2px; padding: 4px 12px 6px; }
  .menu-seg button { flex: 1; background: var(--hover); border: 1px solid transparent; border-radius: 4px; padding: 2px 0; font-size: 11.5px; }
  .menu-seg button.on, .menu-seg button.on:hover:not(:disabled) { background: var(--accent); color: var(--on-accent); }
  .seg { display: flex; gap: 2px; background: var(--bg); border-radius: 6px; padding: 2px; margin: 2px 10px 4px; }
  .seg button { flex: 1; background: none; border: none; color: var(--muted); padding: 3px 8px; font-size: 12px; }
  .seg button.on { background: var(--sel); color: var(--fg); }
  .form .seg { margin: 0; align-self: flex-start; }
  .form .seg button { flex: none; white-space: nowrap; padding: 3px 12px; }

  /* ─── pool updates ─── */
  .update-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; padding: 6px 16px; background: var(--warn-bg); border-bottom: 1px solid var(--warn-line); font-size: 12.5px; flex: none; }
  .update-bar code { font-size: 12px; }
  .update-bar.failed { background: var(--bad-bg); color: var(--bad); flex-wrap: nowrap; }
  .update-failure { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .update-failure.whole { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 40vh; overflow-y: auto; }
  .blind { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .blind-box { width: min(520px, 100%); }
  .blind-box h2 { font-size: 16px; margin: 0 0 4px; }

  /* ─── toasts ─── */
  .toasts { position: fixed; top: 48px; right: 14px; z-index: 40; display: flex; flex-direction: column; gap: 8px; width: min(340px, calc(100vw - 28px)); pointer-events: none; }
  .toast { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 7px; box-shadow: var(--shadow); padding: 8px 8px 8px 12px; font-size: 12.5px; }
  .toast-icon { color: var(--warn); }
  .toast.failed .toast-icon { color: var(--bad); }
  .toast-body { flex: 1; min-width: 0; }
  .toast-body a { color: var(--fg); }
  .toast-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .toast-acts .error { flex-basis: 100%; font-size: 12px; }

  @media (max-width: 760px) {
    .thread { padding: 14px 14px 10px; }
    .composer { margin: 0 auto 8px; width: calc(100% - 20px); }
    .agents { width: calc(100% - 20px); }
    .ask { margin-left: 0; }
    .head-actions button { padding: 3px 7px; }
    .page { padding: 8px 14px 40px; }
    .bar { overflow-x: auto; }
    .bar > .bar-item:not(:first-child), .bar > .bar-sep { display: none; }
    .task > .pane-head, .project > .pane-head { flex-wrap: wrap; }
    .changes { flex-direction: column; overflow-y: auto; }
    .chg-list { flex: none; max-width: none; border-right: none; border-bottom: 1px solid var(--line); overflow: visible; }
    .chg-tree { display: none; }
    .chg-main { flex: none; overflow: visible; padding: 0 14px 40px; }
    .pending-strip { padding: 10px 14px 0; }
  }
</style>
</head>
